[project]
version = "0.1.0"
name = "gemini-vision-mcp"
requires-python = ">=3.11"
description = "Gemini Vision MCP - Describe video, image, audio and text using Gemini Live API."
readme = "README.md"
dependencies = [
    "fastmcp>=3.4.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gemini-vision-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
