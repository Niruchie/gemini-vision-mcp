{{/*
Secret managed by this chart: holds MCP_AUTH_TOKEN (and GOOGLE_API_KEY when
supplied inline). Skipped only when both values come from existing secrets.

The auth token is generated once and preserved on upgrades via lookup(), so
pods keep working after `helm upgrade` without manual intervention.
*/}}
{{- $managed := include "gemini-vision-mcp.fullname" . -}}
{{- $needed := or (not .Values.authToken.existingSecret) (and .Values.apiKey.value (not .Values.apiKey.existingSecret)) -}}
{{- if $needed -}}
{{- $authKey := .Values.authToken.secretKey -}}
{{- $token := .Values.authToken.value -}}
{{- if and (not $token) (not .Values.authToken.existingSecret) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $managed -}}
{{- if and $existing (hasKey ($existing.data | default dict) $authKey) -}}
{{- $token = index $existing.data $authKey | b64dec -}}
{{- end -}}
{{- end -}}
{{- if not $token -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $managed }}
  labels:
    {{- include "gemini-vision-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.authToken.existingSecret }}
  {{ $authKey }}: {{ $token | quote }}
  {{- end }}
  {{- if and .Values.apiKey.value (not .Values.apiKey.existingSecret) }}
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | quote }}
  {{- end }}
{{- end }}
